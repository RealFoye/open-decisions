[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-decisions"
version = "0.1.0"
description = "Self-hosted Decisions API: calibrated probabilities for hundreds of yes/no, choice and rating questions in one pass, with shared-prefix KV reuse."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["llm", "classification", "calibration", "kv-cache", "llm-as-a-judge", "routing", "decisions-api"]
dependencies = [
  "pydantic>=2.5",
  "numpy>=1.24",
  "httpx>=0.25",
]

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.45"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
anthropic = ["anthropic>=0.40"]
all = ["open-decisions[local,server,anthropic]"]
dev = ["open-decisions[all]", "pytest>=8", "tokenizers>=0.19"]

[project.scripts]
opendecisions = "opendecisions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
